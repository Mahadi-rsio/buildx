# buildx sandbox machine (arcetecture.md §2.3). Deployed from a locally-built
# image pushed to registry.fly.io; the daemon listens on :8080 inside the
# machine and is reached via the app hostname through the shared IP.
app = "buildx-sandbox"
primary_region = "sin"

[build]
  image = "registry.fly.io/buildx-sandbox:latest"

[env]
  SANDBOX_PORT = "8080"
  WORKSPACE_ROOT = "/workspace"

[vm]
  cpu_kind = "performance"
  cpus = 2
  memory = "4096"

[mounts]
  source = "buildx_sandbox_data"
  destination = "/workspace"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  autostop = false
  auto_start_machines = false

  [[services.ports]]
    port = 8080
    handlers = ["http"]