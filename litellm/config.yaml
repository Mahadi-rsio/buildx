# LiteLLM Proxy configuration for BuildX.
#
# Every `model_name` is a BuildX alias. The app never sees provider keys or raw
# provider model ids; it sends an alias plus an app-scoped virtual key.
#
# Retries stay disabled (`num_retries: 0`) because the app reserves daily quota
# once per agent step in `onBeforeModelStep`. A retry would hit the same upstream
# again instead of moving on. Deployments use `order` instead: a 429/5xx on
# order 1 immediately escalates to order 2, then order 3, so `auto` still has a
# failover path without app-side retries.
#
# Start with: docker compose up -d litellm
# Keys come from the environment (see .env.example); never hardcode them here.

model_list:
  # `auto` is the only model the app exposes from LiteLLM. All deployments
  # share one model group; `order` makes the proxy try them in sequence when an
  # upstream is rate-limited or unavailable.
  - model_name: auto
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      order: 1
  - model_name: auto
    litellm_params:
      model: openrouter/meta-llama/llama-3.3-70b-instruct
      api_key: os.environ/OPENROUTER_API_KEY
      order: 2
  - model_name: auto
    litellm_params:
      model: openai/openai/gpt-4o-mini
      api_base: https://ai-gateway.vercel.sh/v1
      api_key: os.environ/VERCEL_AI_GATEWAY_API_KEY
      order: 3

litellm_settings:
  drop_params: true
  num_retries: 0

router_settings:
  num_retries: 0
  enable_pre_call_checks: true
  routing_strategy: simple-shuffle

general_settings:
  # Provided via environment. This is the admin/master key; the app uses a
  # separate virtual key created against this proxy.
  master_key: os.environ/LITELLM_MASTER_KEY
