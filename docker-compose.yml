# Local infrastructure for BuildX development.
#
#   cp .env.example .env        # then fill real values
#   pnpm infra:up               # docker compose up -d --wait
#
# Postgres is used by Better Auth + Drizzle. MinIO provides the S3-compatible
# object store for workspace backups and DB dumps.
#
# Both services bind to 127.0.0.1 ONLY. Never expose these ports publicly —
# in production the Postgres instance and the MinIO console must stay off the
# internet (arcetecture.md §9). Credentials come from the environment.
name: buildx

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    container_name: buildx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-buildx}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  minio:
    # NOTE: upstream `minio/minio` was archived in 2026 and its Docker Hub
    # image stopped updating in September 2025. We default to the community
    # drop-in fork `pgsty/minio`, pinned to a release tag (never `latest`).
    # Override with MINIO_IMAGE to point at any S3-compatible server image.
    image: ${MINIO_IMAGE:-pgsty/minio:RELEASE.2026-08-04T00-00-00Z}
    container_name: buildx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000" # S3 API (private)
      - "127.0.0.1:9001:9001" # MinIO console (never public)
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -fs
        - http://localhost:9000/minio/health/live
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  litellm:
    # Unified provider gateway. Retries/fallbacks are disabled in
    # ./litellm/config.yaml so each app-side quota reservation maps to exactly
    # one upstream request.
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:main-stable}
    container_name: buildx-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000" # private: the app talks to it over the local host
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres-data:
  minio-data: