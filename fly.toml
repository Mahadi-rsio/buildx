# Fly.io configuration for BuildX (the @buildx/web Next.js app).
#
#   fly launch --no-deploy --copy-config      # first time only (pick/rename the app)
#   fly secrets set --stage KEY=value ...     # see "Secrets" below
#   fly deploy
#
# The build context is the repository root (this file's directory) because the
# app is a pnpm workspace; the Dockerfile lives in apps/web/.

app = "buildx"                # Fly app names are global — rename if taken.
primary_region = "sin"        # Singapore; pick the region closest to your Neon DB.

# Graceful shutdown: let the in-process run worker and open SSE streams drain.
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "apps/web/Dockerfile"

# Non-secret runtime configuration. Everything else (see .env.example) is a secret.
[env]
  NODE_ENV = "production"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"
  BUILDX_DB_DRIVER = "node-pg"
  # Public URL of the app. Must match the real hostname (custom domain included).
  BETTER_AUTH_URL = "https://buildx.fly.dev"

# Secrets — set with `fly secrets set` (never commit them):
#   DATABASE_URL, BETTER_AUTH_SECRET, UPSTASH_BOX_API_KEY,
#   UPSTASH_REDIS_REST_URL, UPSTASH_REDIS_REST_TOKEN,
#   LITELLM_API_KEY, LITELLM_BASE_URL (LiteLLM must be reachable from Fly —
#   the docker-compose localhost proxy is NOT),
#   S3_ENDPOINT, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_BUCKET_WORKSPACES,
#   S3_BUCKET_DB_BACKUPS, MCP_ENCRYPTION_KEY, and the GITHUB_APP_* values.

[http_service]
  internal_port = 3000
  force_https = true

  # The run worker executes inside the web process (apps/web/instrumentation.ts),
  # so a machine must stay running — never auto-stop it.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    method = "GET"
    path = "/api/config"      # public, cheap, does not touch the database
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
